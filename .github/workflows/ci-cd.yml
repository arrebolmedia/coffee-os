name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# La version de Node sale de .nvmrc, que es lo que ya usa agent-verify.yml.
# Estaba fijada a '18' aqui: EOL desde abril de 2025, y ademas contradecia el
# `engines: node >=20.0.0` que declara el propio package.json del repo.

jobs:
  # Quality checks
  lint-and-format:
    name: 🧹 Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      # `npm run format -- --check` NO comprobaba: el script es
      # `prettier --write`, y el `--check` de mas no lo desactiva. O sea que
      # este paso reformateaba el repositorio dentro del runner y pasaba
      # siempre. Aqui reformateo 170 archivos al ejecutarlo una vez.
      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run type-check

  # Unit tests
  test-unit:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      # Los argumentos van DESPUES de `--` o se los queda turbo, que los
      # rechaza: `npm run test -- --coverage` daba "unexpected argument
      # '--coverage' found" y el job moria antes de ejecutar un solo test.
      # Este paso no ha corrido nunca las pruebas.
      - name: Run unit tests
        run: npm run test:ci

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: success()

  # Build applications
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [lint-and-format, test-unit]
    strategy:
      matrix:
        app: [api, pos-web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: cd packages/database && npm run generate

      - name: Build ${{ matrix.app }}
        run: cd apps/${{ matrix.app }} && npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-build
          path: apps/${{ matrix.app }}/dist

  # Integration tests with database
  test-integration:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: coffeeos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup test database
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/coffeeos_test
        run: |
          cd packages/database
          npm run generate
          # `migrate dev` es interactivo: en el runner muere con "Prisma
          # Migrate has detected that the environment is non-interactive".
          # Ademas intenta CREAR migraciones si detecta deriva, que es lo
          # ultimo que debe hacer un pipeline. `deploy` sólo aplica las que ya
          # estan escritas.
          npm run migrate:deploy

      # Secretos del JWT y la clave con la que se cifran los ajustes.
      #
      # Estas SI deben exigirse al arrancar, al reves que Twilio y Mailrelay:
      # `SETTINGS_ENCRYPTION_KEY` protege los ajustes con AES-256, y un sistema
      # que arranca sin ella guardaria secretos en claro sin decirselo a nadie.
      # Lo que se arregla es dársela al runner, no relajar el requisito.
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/coffeeos_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-solo-para-pruebas-no-usar-en-produccion
          JWT_REFRESH_SECRET: ci-solo-para-pruebas-refresh-no-usar
          SETTINGS_ENCRYPTION_KEY: ci-clave-de-cifrado-solo-para-pruebas-32b
        run: npm run test:integration

  # E2E tests
  test-e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # `docker-compose` con guion no existe en los runners: ahi es el plugin
      # v2, `docker compose`. El paso moria con "command not found".
      - name: Levantar Postgres y Redis
        run: docker compose up -d postgres redis

      # Y esperar a que Postgres ACEPTE conexiones, en vez de dormir 30
      # segundos y cruzar los dedos: en un runner cargado tarda mas, y en uno
      # rapido se desperdician.
      - name: Esperar a Postgres
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T postgres pg_isready -U coffeeos >/dev/null 2>&1; then
              echo "Postgres listo en el intento $i"; exit 0
            fi
            sleep 2
          done
          echo "Postgres no respondio"; docker compose logs postgres; exit 1

      # La suite de navegador necesita catalogo y un usuario con el que entrar:
      # sin sembrar, el login falla y fallan las 200 pruebas por la misma razon.
      - name: Migrar y sembrar
        env:
          DATABASE_URL: postgresql://coffeeos:coffeeos123@localhost:5434/coffeeos_dev
        run: |
          npm run migrate:deploy --workspace=@coffeeos/database
          npm run db:seed

      # Mismas variables que en integracion.
      - name: Levantar la aplicacion
        env:
          DATABASE_URL: postgresql://coffeeos:coffeeos123@localhost:5434/coffeeos_dev
          JWT_SECRET: ci-solo-para-pruebas-no-usar-en-produccion
          JWT_REFRESH_SECRET: ci-solo-para-pruebas-refresh-no-usar
          SETTINGS_ENCRYPTION_KEY: ci-clave-de-cifrado-solo-para-pruebas-32b
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXTAUTH_URL: http://localhost:3001
          NEXTAUTH_SECRET: ci-solo-para-pruebas-nextauth
        run: |
          npm run dev > /tmp/coffeeos-dev.log 2>&1 &
          for i in $(seq 1 90); do
            api=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/api/v1/health || true)
            web=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/login || true)
            if [ "$api" = "200" ] && [ "$web" = "200" ]; then
              echo "API y pos-web listos en el intento $i"; exit 0
            fi
            sleep 2
          done
          echo "No arrancaron. Ultimo estado: api=$api web=$web"
          echo "===== log completo ====="
          # 60 lineas se quedaban en el banner de turbo, sin llegar al error de
          # verdad: la causa siempre aparecia mas abajo.
          cat /tmp/coffeeos-dev.log
          exit 1

      - name: Run E2E tests
        run: npm run test:e2e --workspace=@coffeeos/pos-web

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results/

  # Security scan
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    # Sin este permiso, subir el SARIF falla con "Resource not accessible by
    # integration" y el job entero queda en rojo: el escaneo corria y su
    # resultado no llegaba a ninguna parte.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      # Lo que BLOQUEA es lo critico en lo que se despliega. Las de las
      # herramientas de desarrollo (plugins de eslint, minimatch) no viajan al
      # servidor, y con `moderate` sobre todo el arbol el job vivia en rojo por
      # ellas — otro gate que nadie mira.
      - name: Auditar dependencias de produccion
        run: npm audit --omit=dev --audit-level=critical

      # Y las demas se IMPRIMEN en cada corrida, sin bloquear, para que sigan a
      # la vista. Hoy quedan 4 en produccion, una de ellas alta: postcss (XSS al
      # serializar CSS) dentro de next. Arreglarla es subir a next 16, un salto
      # de major que necesita su propia decision — anotado en CLAUDE.md.
      - name: Auditoria completa (informativa)
        continue-on-error: true
        run: |
          echo "== Produccion =="
          npm audit --omit=dev || true
          echo "== Todo el arbol, desarrollo incluido =="
          npm audit || true

  # Docker build and push
  #
  # APAGADO A PROPOSITO. No hay un solo Dockerfile en el repo, y la matriz
  # incluye `admin-web`, que se elimino en agosto de 2026. Se enciende cuando
  # existan las imagenes; mientras tanto, un job que no puede funcionar solo
  # sirve para tener el pipeline en rojo permanente, que es como no tenerlo.
  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [test-integration, test-e2e]
    if: false
    strategy:
      matrix:
        app: [api, pos-web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: coffeeos/${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to staging
  #
  # APAGADO A PROPOSITO. El unico paso es `echo "Deploying..."` con un
  # comentario que dice "add actual deployment commands here". No hay a donde
  # desplegar todavia.
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker]
    if: false
    environment:
      name: staging
      url: https://staging.coffeeos.mx
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add actual deployment commands here

  # Deploy to production
  #
  # APAGADO A PROPOSITO, y este es el importante: no desplegaba nada —el paso
  # era un `echo`— y a continuacion mandaba a Slack "🎉 CoffeeOS deployed to
  # production successfully!". Hoy no se ejecuta solo porque los jobs previos
  # fallan; en cuanto el pipeline se pusiera verde, empezaria a anunciar
  # despliegues a produccion que no ocurren. Un aviso falso es peor que
  # ninguno: se cree.
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker, security]
    if: false
    environment:
      name: production
      url: https://coffeeos.mx
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add actual deployment commands here

      - name: Notify Slack
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: '🎉 CoffeeOS deployed to production successfully!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
